name: Deploy to Supabase + Vercel

on:
  push:
    branches: [main]

jobs:
  init-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install

      - name: Initialize Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm tsx scripts/init-db.ts

  # Vercel은 GitHub과 자동 연결되어 자동 배포되므로 이 부분 제거
  # main 브랜치에 push하면 Vercel이 자동으로 감지하고 배포합니다
